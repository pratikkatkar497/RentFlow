# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/rentflow_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server
server.port=9090

# Application
spring.application.name=RentFlow

# Logging
logging.level.org.springframework=INFO
logging.level.com.rentflow=DEBUG


jwt.secret=RentFlowSecretKeyForJwtAuthentication2026RentFlowSecureKey
jwt.expiration=86400000